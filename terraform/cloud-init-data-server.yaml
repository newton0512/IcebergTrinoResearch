#cloud-config

# Update system
package_update: true
package_upgrade: true

# Install required packages
packages:
  - docker.io
  - docker-compose
  - postgresql
  - postgresql-contrib
  - openjdk-17-jdk
  - wget
  - curl
  - unzip

# Create directories
runcmd:
  - mkdir -p /opt/minio/data
  - mkdir -p /opt/trino
  - mkdir -p /opt/nessie
  - mkdir -p /opt/docker-compose

# Setup PostgreSQL for Nessie
- |
  sudo -u postgres psql -c "CREATE USER nessie WITH PASSWORD 'nessie_password';"
  sudo -u postgres psql -c "CREATE DATABASE nessie_catalog OWNER nessie;"
  sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE nessie_catalog TO nessie;"

# Create docker-compose for services
- |
  cat > /opt/docker-compose/docker-compose.yml << 'EOF'
version: '3.8'

services:
  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - /opt/minio/data:/data
    restart: unless-stopped

  trino:
    image: trinodb/trino:latest
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Xmx16G
    volumes:
      - /opt/trino/etc:/etc/trino
    depends_on:
      - minio
      - nessie
    restart: unless-stopped

  nessie:
    image: projectnessie/nessie:latest
    ports:
      - "19120:19120"
    environment:
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://localhost:5432/nessie_catalog
      - QUARKUS_DATASOURCE_USERNAME=nessie
      - QUARKUS_DATASOURCE_PASSWORD=nessie_password
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: nessie_catalog
      POSTGRES_USER: nessie
      POSTGRES_PASSWORD: nessie_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
EOF

# Start services
- systemctl enable docker
- systemctl start docker
- cd /opt/docker-compose && docker-compose up -d

# Wait for services to start and create basic configs
- |
  sleep 30
  # Create MinIO bucket for Iceberg
  docker run --rm --network host minio/mc mb minio/iceberg-bucket
  
  # Create Trino catalog configuration
  mkdir -p /opt/trino/etc/catalog
  cat > /opt/trino/etc/catalog/iceberg.properties << 'EOF'
connector.name=iceberg
iceberg.catalog.type=nessie
iceberg.nessie.uri=http://localhost:19120/api/v1
iceberg.nessie.ref=main
iceberg.file-format=PARQUET
iceberg.warehouse=s3://iceberg-bucket/
fs.s3.endpoint=http://localhost:9000
fs.s3.path-style-access=true
fs.s3.aws-access-key=minioadmin
fs.s3.aws-secret-key=minioadmin
EOF

  # Restart Trino to apply config
  cd /opt/docker-compose && docker-compose restart trino

final_message: "Data Server setup complete! Services: MinIO(9000), Trino(8080), Nessie(19120), PostgreSQL(5432)"