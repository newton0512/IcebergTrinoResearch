---
# load_public_ip, data_private_ip — из inventory/group_vars/all.yml (обновляет refresh-inventory.sh)

all:
  children:
    load_test_server:
      hosts:
        load:
          ansible_host: "{{ load_public_ip }}"

    data_server:
      hosts:
        data:
          ansible_host: "{{ data_private_ip }}"
          ansible_ssh_common_args: '-o ProxyCommand="ssh -i {{ ansible_ssh_private_key_file }} -W %h:%p {{ ansible_user }}@{{ load_public_ip }}"'
