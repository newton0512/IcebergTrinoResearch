services:
  starter:
    image: curlimages/curl:8.17.0
    depends_on:
      - postgres
      - minio
      - nessie
      - trino
      - clickhouse
      - rabbitmq
      - create-minio-bucket
      - create-nessie-db
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Waiting for Postgres..." && (until nc -z postgres 5432; do sleep 1; done)
        echo "Waiting for MinIO..." && (until nc -z minio 9000; do sleep 1; done)
        echo "Waiting for Nessie..." && (until curl -fs http://nessie:19120/; do sleep 1; done)
        echo "Waiting for Trino..." && (until curl -fs http://trino:8080/v1/info; do sleep 1; done)
        echo "Waiting for ClickHouse..." && (until curl -fs http://clickhouse:8123/ping; do sleep 1; done)
        echo "Waiting for RabbitMQ..." && (until curl -fs http://rabbitmq:15672/api/overview -u guest:guest; do sleep 1; done)
        echo "All services ready"

  postgres:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    # Tuned for bulk insert performance (dev/testing only)
    command: >
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=256MB
      -c checkpoint_timeout=30min
      -c max_wal_size=4GB
      -c min_wal_size=1GB
      -c wal_buffers=64MB
      -c synchronous_commit=off
      -c wal_writer_delay=1000ms
      -c commit_delay=100000
      -c random_page_cost=1.1

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - E:/s3-data:/data

  nessie:
    image: ghcr.io/projectnessie/nessie:0.106.0
    depends_on:
      - postgres
      - create-nessie-db
    environment:
      QUARKUS_HTTP_PORT: 19120
      # Настройка JDBC хранилища вместо IN_MEMORY
      NESSIE_VERSION_STORE_TYPE: JDBC2
      NESSIE_VERSION_STORE_PERSIST_JDBC_DATASOURCE: postgresql
      # Подключение к PostgreSQL (отдельная база данных для Nessie)
      QUARKUS_DATASOURCE_POSTGRESQL_JDBC_URL: jdbc:postgresql://postgres:5432/nessie
      QUARKUS_DATASOURCE_POSTGRESQL_USERNAME: postgres
      QUARKUS_DATASOURCE_POSTGRESQL_PASSWORD: postgres
    ports:
      - "19120:19120"
    volumes:
      - E:/nessie:/var/lib/nessie

  trino:
    image: trinodb/trino:479
    depends_on:
      - nessie
      - create-minio-bucket
      - create-nessie-ref
    ports:
      - "8080:8080"
    volumes:
      - ./trino/config.properties:/etc/trino/config.properties:ro
      - ./trino/jvm.config:/etc/trino/jvm.config:ro
      - ./trino/catalog/iceberg.properties:/etc/trino/catalog/iceberg.properties:ro
    deploy:
      resources:
        limits:
          memory: 20G

  trino-fte:
    image: trinodb/trino:479
    depends_on:
      - nessie
      - create-minio-bucket
      - create-nessie-ref
    ports:
      - "8080:8080"
    volumes:
      - ./trino-fte/config.properties:/etc/trino/config.properties:ro
      - ./trino-fte/jvm.config:/etc/trino/jvm.config:ro
      - ./trino-fte/exchange-manager.properties:/etc/trino/exchange-manager.properties:ro
      - ./trino-fte/catalog/iceberg.properties:/etc/trino/catalog/iceberg.properties:ro
      - ./trino-fte/catalog/postgres.properties:/etc/trino/catalog/postgres.properties:ro
    deploy:
      resources:
        limits:
          memory: 16G

  create-minio-bucket:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        until mc alias set local http://minio:9000 minioadmin minioadmin 2>/dev/null; do
          echo "Waiting for MinIO..."
          sleep 2
        done
        mc mb -p local/warehouse || true
        mc anonymous set public local/warehouse || true
        echo "Bucket 'warehouse' ready"

  create-nessie-db:
    image: postgres:18.1-alpine
    depends_on:
      - postgres
    environment:
      PGPASSWORD: postgres
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Waiting for Postgres..."
        until pg_isready -h postgres -U postgres; do sleep 1; done
        echo "Creating Nessie database..."
        psql -h postgres -U postgres -c "CREATE DATABASE nessie;" || echo "Database 'nessie' may already exist"
        echo "Nessie database ready"

  create-nessie-ref:
    image: curlimages/curl:8.17.0
    depends_on:
      - nessie
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Waiting for Nessie..."
        until curl -fs http://nessie:19120/api/v2/config 2>/dev/null; do
          sleep 1
        done
        echo "Creating 'main' reference in Nessie..."
        # Проверяем, существует ли ссылка 'main'
        if curl -fs http://nessie:19120/api/v2/references/main 2>/dev/null; then
          echo "Reference 'main' already exists"
        else
          # Создаем ссылку 'main' как BRANCH
          curl -X POST http://nessie:19120/api/v2/references \
            -H "Content-Type: application/json" \
            -d '{"name":"main","type":"BRANCH"}' || echo "Failed to create 'main' reference (may already exist)"
        fi
        echo "Nessie reference 'main' ready"

  clickhouse:
    image: clickhouse/clickhouse-server:25.12
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_DB: default
    ports:
      - "8123:8123"
      - "9009:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    deploy:
      resources:
        limits:
          memory: 16G
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # K6 для нагрузочного тестирования
  k6:
    image: grafana/k6:latest
    container_name: k6-load-test
    networks:
      - default
    extra_hosts:
      # Позволяет подключаться к API серверу на хосте (Windows/Mac)
      # На Linux используйте network_mode: host или другие способы
      - "host.docker.internal:host-gateway"
    volumes:
      # Монтируем папку со скриптами K6
      # Путь относительно директории compose/ (где находится docker-compose.yml)
      # При запуске из samples-generation/ с флагом -f compose/docker-compose.yml
      # пути должны быть ../k6-scripts
      - ../k6-scripts:/scripts:ro
      # Монтируем папку для результатов (опционально)
      - ../k6-results:/results
    environment:
      # URL API сервера (по умолчанию на хосте, можно изменить через переменную)
      - K6_API_URL=${K6_API_URL:-http://host.docker.internal:3000}
      # Дополнительные переменные для K6 скриптов
      - K6_VUS=${K6_VUS:-10}
      - K6_DURATION=${K6_DURATION:-30s}
    # По умолчанию контейнер не запускается автоматически (используется profile)
    # Запускается вручную: docker compose --profile k6 run --rm k6 run /scripts/test.js
    profiles:
      - k6

volumes:
  pg_data:
  pg_primary_data:
  pg_replica1_data:
  pg_replica2_data:
  # minio_data:
  clickhouse_data:
  trino_exchange:
  rabbitmq_data:
