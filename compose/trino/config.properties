coordinator=true
node-scheduler.include-coordinator=true
node.environment=development
http-server.http.port=8080

# Memory limits
query.max-memory=11GB
query.max-memory-per-node=11GB
memory.heap-headroom-per-node=2GB

# HTTP server limits - увеличиваем для поддержки большего количества соединений
http-server.http.acceptor-threads=4
http-server.http.selector-threads=8
http-server.threads.max=200
http-server.threads.min=50

# Client timeout - увеличиваем для длительных операций
query.client.timeout=2h

# Query execution limits
task.concurrency=4
task.max-worker-threads=16
