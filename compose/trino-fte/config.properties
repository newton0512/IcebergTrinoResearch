coordinator=true
node-scheduler.include-coordinator=true
node.environment=development
http-server.http.port=8080


memory.heap-headroom-per-node=1GB
query.max-memory=3GB
query.max-memory-per-node=3GB
query.max-length=10485760
query.max-total-memory=6GB

# HTTP server limits - увеличиваем для поддержки большего количества соединений
http-server.http.acceptor-threads=2
http-server.http.selector-threads=4
http-server.threads.max=100
http-server.threads.min=25

# Client timeout - allow long-running queries
query.client.timeout=2h

# Query execution limits
task.concurrency=1
task.max-worker-threads=4

# Ограничения на количество одновременных запросов (защита от перегрузки)
# Ограничиваем количество запросов в очереди и одновременно выполняющихся
query-manager.required-workers=1
query.max-run-time=15m
query.max-execution-time=15m

node-scheduler.max-splits-per-node=100
node-scheduler.min-pending-splits-per-task=10

# Fault-tolerant execution
retry-policy=TASK

