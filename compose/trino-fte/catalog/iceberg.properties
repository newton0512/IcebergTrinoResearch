connector.name=iceberg
iceberg.catalog.type=nessie
iceberg.nessie-catalog.uri=http://nessie:19120/api/v2
iceberg.nessie-catalog.default-warehouse-dir=s3://warehouse/
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.path-style-access=true
s3.region=us-east-1
s3.aws-access-key=minioadmin
s3.aws-secret-key=minioadmin

# Обязательный параметр: имя коннектора
connector.name=iceberg

# Формат файлов (parquet, orc, avro)
iceberg.file-format=parquet

# Кодек сжатия (snappy, zstd, gzip)
iceberg.compression-codec=snappy

# Максимальный размер файла (например, 256MB)
iceberg.target-max-file-size=256MB

# Ограничение числа партиций на writer
iceberg.max-partitions-per-writer=1000
